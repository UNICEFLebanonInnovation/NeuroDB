<table class="table table-bordered">
    <thead>
    <tr>
        <th>#</th>
        {% for th in header %}
         <th>{{th}}</th>
      {% endfor %}
    </tr>
    </thead>
  <tbody>
    {% for pl in values %}
    <tr>
        <td>{{ forloop.counter }}</td>
      {% for l in pl%}

      {% endfor %}
    </tr>
    {% endfor %}
  </tbody>
</table>
