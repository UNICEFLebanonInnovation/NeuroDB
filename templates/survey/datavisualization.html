{% extends template %}
{% load static i18n %}
{% block project_title %}{% endblock %}

{% block content %}
<div class="app-main__inner ">
	<div class="row">
		<div class="col-md-12">
			<div class="main-card mb-3 card" style="height: 80vh;overflow: scroll;">
				<div class="card-header">Data Visualization
					<div class="btn-actions-pane-right">
						<div role="group" class="btn-group-sm btn-group"> </div>
					</div>
				</div>
				<div class="table-responsive">
					<table class="align-middle mb-0 table table-borderless table-striped table-hover">
						<tbody> {% for entry in entries %}
							<tr>
								<!--<td class="text-center text-muted">#345</td>-->
								<td> 
									<div class="widget-content p-0 ml-3">
										<div class="widget-content-wrapper">
											<div class="widget-content-left mr-3">
												<div class="widget-content-left"> <img width="40" class="rounded-circle" src="{% static 'images/map.png' %}" alt=""> </div>
											</div>
											<div class="widget-content-left flex2">
												<div class="widget-heading">{{ entry.name }}</div>
												<div class="widget-subheading opacity-7">{{ entry.description }}</div>
											</div>
										</div>
									</div>
								</td>
								<td class="text-center"> <a href="{{ entry.link }}" target="_blank" type="button" class="btn btn-primary btn-sm">View Data</a> </td>
							</tr> {% endfor %} </tbody>
					</table>
				</div>
			</div>
		</div>
	</div>
</div>{% endblock %}
