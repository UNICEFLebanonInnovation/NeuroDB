{% load i18n ui %}
<form method="get" action="{% url 'fmm:dashboard' %}" id="fmm-filters" class="filter-bar" data-filter-bar data-hx-target="#fmm-results" role="search" aria-label="{% trans 'Monitoring insights filters' %}">
  <div class="filter-bar__field">
    <label class="form-label" for="f-period">{% trans "Period" %}</label>
    <select class="form-select form-select-sm" id="f-period" name="period">
      {% for key, label in presets %}<option value="{{ key }}" {% if scope.preset == key %}selected{% endif %}>{{ label }}</option>{% endfor %}
      <optgroup label="{% trans 'Calendar year' %}">
        {% for y in options.years %}<option value="{{ y }}" {% if scope.preset == "year" and scope.year == y %}selected{% endif %}>{{ y }}</option>{% endfor %}
        {% if scope.preset == "year" and scope.year not in options.years %}<option value="{{ scope.year }}" selected>{{ scope.year }}</option>{% endif %}
      </optgroup>
    </select>
  </div>
  <div class="filter-bar__field fmm-dates">
    <label class="form-label" for="f-from">{% trans "From" %}</label>
    <input class="form-control form-control-sm" type="date" id="f-from" name="from" value="{% if scope.preset == 'custom' %}{{ scope.start|date:'Y-m-d' }}{% endif %}">
  </div>
  <div class="filter-bar__field fmm-dates">
    <label class="form-label" for="f-to">{% trans "To" %}</label>
    <input class="form-control form-control-sm" type="date" id="f-to" name="to" value="{% if scope.preset == 'custom' %}{{ scope.end|date:'Y-m-d' }}{% endif %}">
  </div>
  <div class="filter-bar__field">
    <label class="form-label" for="f-section">{% trans "Section" %}</label>
    {% comment %}The empty "section" always goes with the form: "every section" is then a choice, and the
    user's default section applies only on a bare first visit.{% endcomment %}
    <input type="hidden" name="section" value="" data-keep-empty>
    <select class="form-select form-select-sm" id="f-section" name="section" multiple data-tom placeholder="{% trans 'All sections' %}">
      {% for name in options.sections %}<option value="{{ name }}" {% if name in scope.sections %}selected{% endif %}>{{ name }}</option>{% endfor %}
      <option value="none" {% if "none" in scope.sections %}selected{% endif %}>{% trans "No section" %}</option>
    </select>
  </div>
  <div class="filter-bar__field">
    <label class="form-label" for="f-governorate">{% trans "Governorate" %}</label>
    <select class="form-select form-select-sm" id="f-governorate" name="governorate">
      <option value="">{% trans "All" %}</option>
      {% for key, name in options.governorates %}<option value="{{ key }}" {% if key == scope.governorate %}selected{% endif %}>{{ name }}</option>{% endfor %}
      <option value="none" {% if scope.governorate == "none" %}selected{% endif %}>{% trans "Not located" %}</option>
    </select>
  </div>
  <div class="filter-bar__field">
    <label class="form-label" for="f-office">{% trans "Field office" %}</label>
    <select class="form-select form-select-sm" id="f-office" name="office" multiple data-tom placeholder="{% trans 'All' %}">
      {% for name in options.offices %}<option value="{{ name }}" {% if name in scope.offices %}selected{% endif %}>{{ name }}</option>{% endfor %}
      <option value="none" {% if "none" in scope.offices %}selected{% endif %}>{% trans "Office not known" %}</option>
    </select>
  </div>
  <div class="filter-bar__field">
    <label class="form-label" for="f-partner">{% trans "Partner" %}</label>
    <select class="form-select form-select-sm" id="f-partner" name="partner" multiple data-tom placeholder="{% trans 'All' %}">
      {% for pid, name in options.partners %}<option value="{{ pid }}" {% if pid in scope.partners %}selected{% endif %}>{{ name }}</option>{% endfor %}
    </select>
  </div>
  <div class="filter-bar__field">
    <label class="form-label" for="f-entity-type">{% trans "Entity type" %}</label>
    <select class="form-select form-select-sm" id="f-entity-type" name="entity_type" multiple data-tom placeholder="{% trans 'All' %}">
      {% for key, label in kind_labels.items %}<option value="{{ key }}" {% if key in scope.entity_types %}selected{% endif %}>{{ label }}</option>{% endfor %}
    </select>
  </div>
  <div class="filter-bar__field">
    <label class="form-label" for="f-rating">{% trans "Rating" %}</label>
    <select class="form-select form-select-sm" id="f-rating" name="rating" multiple data-tom placeholder="{% trans 'All' %}">
      {% for key, label in rating_labels.items %}<option value="{{ key }}" {% if key in scope.ratings %}selected{% endif %}>{{ label }}</option>{% endfor %}
    </select>
  </div>
  <div class="filter-bar__field">
    <label class="form-label" for="f-status">{% trans "Status" %}</label>
    <select class="form-select form-select-sm" id="f-status" name="status" multiple data-tom placeholder="{% trans 'All' %}">
      {% for key, label in status_labels.items %}<option value="{{ key }}" {% if key in scope.statuses %}selected{% endif %}>{{ label }}</option>{% endfor %}
    </select>
  </div>
  <div class="filter-bar__field">
    <label class="form-label" for="f-modality">{% trans "Modality" %}</label>
    <select class="form-select form-select-sm" id="f-modality" name="modality" multiple data-tom placeholder="{% trans 'All' %}">
      {% for name in options.modalities %}<option value="{{ name }}" {% if name in scope.modalities %}selected{% endif %}>{{ name }}</option>{% endfor %}
      <option value="none" {% if "none" in scope.modalities %}selected{% endif %}>{% trans "Modality not known" %}</option>
    </select>
  </div>
  <div class="filter-bar__field">
    <label class="form-label" for="f-quality">{% trans "Quality" %}</label>
    <select class="form-select form-select-sm" id="f-quality" name="quality" multiple data-tom placeholder="{% trans 'All' %}">
      {% for key, label in quality_labels.items %}<option value="{{ key }}" {% if key in scope.quality_bands %}selected{% endif %}>{{ label }}</option>{% endfor %}
    </select>
  </div>
  <div class="filter-bar__field">
    <label class="form-label" for="f-urgency-level">{% trans "Urgency" %}</label>
    <select class="form-select form-select-sm" id="f-urgency-level" name="urgency_level" multiple data-tom placeholder="{% trans 'All' %}">
      {% for key, label in urgency_labels.items %}<option value="{{ key }}" {% if key in scope.urgency_levels %}selected{% endif %}>{{ label }}</option>{% endfor %}
    </select>
  </div>
  <div class="filter-bar__field">
    <label class="form-label" for="f-q">{% trans "Search" %}</label>
    <input class="form-control form-control-sm" type="search" id="f-q" name="q" value="{{ scope.q }}" placeholder="{% trans 'Visit, reference, partner, PD or place' %}">
  </div>
  <div class="filter-bar__field">
    <span class="form-label">{% trans "Show only" %}</span>
    <label class="form-check mb-0 small"><input class="form-check-input" type="checkbox" name="programmatic" value="1" {% if scope.programmatic %}checked{% endif %}> {% trans "Programmatic visits only" %}</label>
  </div>
  {% if scope.pd is not None %}<input type="hidden" name="pd" value="{{ scope.pd }}">{% endif %}
  <div class="filter-bar__actions">
    <button type="submit" class="btn btn-primary btn-sm">{% trans "Apply" %}</button>
    <a class="btn btn-link btn-sm" href="{% url 'fmm:dashboard' %}">{% trans "Reset" %}</a>
  </div>
</form>
