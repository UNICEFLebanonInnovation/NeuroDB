{% load i18n %}
{% url 'fmm:dashboard' as page_url %}
<section class="panel">
  <div class="state state--empty" role="status">
    {% include "components/icon.html" with name="inbox" class="state__icon" %}
    <p class="state__title">{% trans "No visits in this filter — widen the period" %}</p>
    <div class="d-flex gap-2 flex-wrap justify-content-center">
      <a class="btn btn-outline-primary btn-sm" href="{{ page_url }}?section=&amp;tab={{ tab }}">{% trans "Clear filters" %}</a>
      <a class="btn btn-outline-secondary btn-sm" href="{{ page_url }}?{{ this_year_query }}&amp;tab={{ tab }}">{% trans "Try this year" %}</a>
    </div>
  </div>
</section>
