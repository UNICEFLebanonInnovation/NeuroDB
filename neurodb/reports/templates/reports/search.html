{% extends "base.html" %}
{% load i18n %}
{% block content %}
<form method="get" class="filter-bar" role="search">
  <div class="filter-bar__field" style="max-width: none; flex-grow: 3">
    <label class="form-label" for="page-q">{% trans "Search" %}</label>
    <input class="form-control" type="search" id="page-q" name="q" value="{{ q }}" autofocus hx-get="{% url 'reports:search' %}" hx-trigger="input changed delay:250ms" hx-target="#page-results" hx-push-url="true" placeholder="{% trans 'Indicators, databases, reports…' %}">
  </div>
</form>
<section class="panel p-0" id="page-results" aria-live="polite">{% include "reports/partials/search_results.html" %}</section>
{% endblock %}
