{% load i18n %}
<div class="modal-header">
  <div>
    <div class="resource-card__type">{% trans "Map" %}</div>
    <h2 class="modal-title h5" id="modal-title">{{ item.name }}</h2>
  </div>
  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="{% trans 'Close' %}"></button>
</div>
<div class="modal-body">
  {% include "reports/partials/_map_item_body.html" %}
</div>
<div class="modal-footer">
  <a class="btn btn-link btn-sm me-auto" href="{% url 'reports:map_item' item.id %}">{% trans "Open as page" %}</a>
  {% if item.link %}<a class="btn btn-primary btn-sm" href="{{ item.link }}" target="_blank" rel="noopener noreferrer">{% include "components/icon.html" with name="external" %}<span>{% trans "Open map" %}</span></a>{% endif %}
</div>
