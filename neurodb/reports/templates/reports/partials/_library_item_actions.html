{% load i18n %}
{% if resource.resource_link %}<a class="btn btn-outline-secondary btn-sm" href="{{ resource.resource_link }}" target="_blank" rel="noopener noreferrer">{% include "components/icon.html" with name="external" %}<span>{% trans "Open link" %}</span></a>{% endif %}
{% if resource.resource_file_name %}<a class="btn btn-primary btn-sm" href="{% url 'reports:library_download' resource.id %}">{% include "components/icon.html" with name="download" %}<span>{% trans "Download" %}</span></a>{% endif %}
