{% load i18n %}
<div class="modal-header">
  <div><h2 class="modal-title h5" id="modal-title">{{ pd.number|default:pd.title }}</h2><div class="small text-muted">{{ pd.title }}</div></div>
  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="{% trans 'Close' %}"></button>
</div>
<div class="modal-body">{% include "reports/partials/_programme_body.html" %}</div>
<div class="modal-footer"><a class="btn btn-outline-secondary btn-sm" href="{% url 'reports:programme_detail' pd.id %}">{% trans "Open as page" %}</a></div>
