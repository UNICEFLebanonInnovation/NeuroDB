{% load i18n %}
<div class="modal-header">
  <div><h2 class="modal-title h5" id="modal-title">{{ page_title }}</h2><div class="small text-muted">{{ page_subtitle }}</div></div>
  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="{% trans 'Close' %}"></button>
</div>
<div class="modal-body">{% include "reports/partials/_pd_indicator_body.html" %}</div>
<div class="modal-footer"><a class="btn btn-outline-secondary btn-sm" href="{{ request.get_full_path }}">{% trans "Open as page" %}</a></div>
