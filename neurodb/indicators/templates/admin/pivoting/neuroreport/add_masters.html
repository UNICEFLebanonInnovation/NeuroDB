{% extends "admin/base_site.html" %}
{% block content %}
<h2>{{ title }}</h2>
<form method="post">{% csrf_token %}
  <fieldset class="module aligned">
    <div class="form-row"><label>By tag</label>{{ form.tags }}</div>
    <div class="form-row"><label>Or select master indicators</label>{{ form.masters }}</div>
  </fieldset>
  <div class="submit-row"><input type="submit" class="default" value="Add"></div>
</form>
{% endblock %}
