trigger:
  branches:
    include:
    - master
variables:
- name: dockerRegistryServiceConnection
  value: 'unilebepics'
- name: dockerfile
  value: "$(System.DefaultWorkingDirectory)/compose/production/django/Dockerfile"
- name: app
  value: 'uni-leb-neourodb'
- name: WebAppName
  value: 'uni-leb-neourodb-tst'
- name: imageRepository
  value: 'dev/$(app)'
- name: tag
  value: 'latest'
- name: pythonVersion
  value: '3.9'
stages:
- stage: __default
  jobs:
  - job: Job
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: Docker@2
      displayName: Build and push image to container registry
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: "$(System.DefaultWorkingDirectory)/compose/production/django/Dockerfile"
        buildContext: "$(System.DefaultWorkingDirectory)"
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)
    - task: AzureWebAppContainer@1
      inputs:
        azureSubscription: 'UNI_APPS RS-UNI-LEB'
        appName: $(app)
        imageName: unilebepics.azurecr.io/$(imageRepository):$(tag)
        deployToSlotOrASE: true
        resourceGroupName: 'rs-uni-leb'
        slotName: tst